[project]
name = "circuit-coach"
version = "0.1.0"
description = "Knowledge tracing and recommendation service for Circuit Coach (DFSI Problem 3B)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "numpy>=1.26",
]

[project.optional-dependencies]
eval = ["pandas>=2.1", "scikit-learn>=1.4", "scipy>=1.11", "matplotlib>=3.8", "pyarrow>=15", "gdown>=5"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["circuit_coach"]
