name: tests

on:
  push:
  pull_request:

jobs:
  engine:
    name: Engine service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[eval,dev]"
      - run: pytest -q

  app:
    name: Prototype (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  end-to-end:
    name: End to end (prototype against the running service)
    runs-on: ubuntu-latest
    needs: [engine, app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the engine service
        working-directory: backend
        run: |
          pip install -e .
          nohup python -m uvicorn circuit_coach.api:app --port 8000 > service.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && exit 0; sleep 1; done
          cat service.log; exit 1
      - name: Run the journey tests
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:8000
        run: |
          npm ci
          npm run test:e2e
