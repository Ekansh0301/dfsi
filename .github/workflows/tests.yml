name: tests

on:
  push:
  pull_request:

jobs:
  engine:
    name: Engine service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[eval,dev]"
      - run: pytest -q

  app:
    name: Prototype (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  end-to-end:
    name: End to end (prototype against the running service)
    runs-on: ubuntu-latest
    needs: [engine, app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the engine service
        working-directory: backend
        run: |
          pip install -e .
          nohup python -m uvicorn circuit_coach.api:app --port 8000 > service.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && exit 0; sleep 1; done
          cat service.log; exit 1
      - name: Run the journey tests
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:8000
        run: |
          npm ci
          npm run test:e2e

  docker:
    name: Docker images (build and smoke test)
    runs-on: ubuntu-latest
    needs: [engine, app]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start both containers
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Engine answers, with the fitted parameters and storage
        run: |
          curl -sf http://localhost:8000/health | tee health.json
          grep -q '"parameters":"fitted"' health.json
          curl -sf -X POST http://localhost:8000/v1/quiz-result -H 'Content-Type: application/json' \
            -d '{"state":{},"module_id":"m3","events":[{"concept_tags":["diagrams"],"is_correct":false}],"learner_id":"ci"}'
          curl -sf http://localhost:8000/v1/learners/ci/state
      - name: Prototype is served
        run: |
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          curl -sf http://localhost:8080/sw.js > /dev/null
      - name: Logs on failure
        if: failure()
        run: docker compose logs
